  correction_pressure_levels_hpa: [1000, 925, 850, 700, 500, 300]
  height_bands_km:
    low: [0.5, 2.0]
    middle: [2.0, 5.0]
    upper: [5.0, 9.0]
  baseline_interpolation: log_linear_total_with_interpolated_wet_fraction
  correction_interpolation: linear_in_geometric_height_no_extrapolation
  output_schema_version: 2

sampling_gate:
  expansion_days_of_month: [5, 15, 25]
  expected_one_day_archives: 24
  expected_expanded_archives: 72
  leave_one_archive_absolute_threshold_n_units: 0.10
  leave_one_archive_relative_threshold: 0.25
  maximum_archive_row_fraction: 0.10
  maximum_year_difference_n_units: 0.20
  primary_height_bands: [low, middle, upper]

statistics:
  bootstrap_replicates: 10000
  seed: 42
  confidence_levels: [0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  pit_bins: 20
  decomposition_tolerance: 1.0e-10
  seasonal_reproduction_tolerance: 1.0e-10

